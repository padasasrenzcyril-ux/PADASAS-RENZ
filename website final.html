<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philippine Tourist Spots</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef8ff;
            color: #243447;
        }

        header {
            background: #0077b6;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background: #023e8a;
        }

        nav button {
            background: white;
            color: #023e8a;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 15px;
        }

        nav button:hover,
        nav button.active {
            background: #90e0ef;
        }

        main {
            max-width: 950px;
            width: 92%;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 12px #00000015;
            text-align: center;
            min-height: 350px;
        }

        .hero-photo {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            background: #dbeafe;
        }

        h2 {
            color: #0077b6;
        }

        .search-box {
            width: 100%;
            max-width: 450px;
            padding: 12px;
            margin: 15px auto;
            border: 1px solid #b8cbd9;
            border-radius: 8px;
            font-size: 16px;
        }

        .explore {
            display: inline-block;
            margin: 8px 5px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #0077b6;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .explore:hover {
            background: #023e8a;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            border: 1px solid #dce8f0;
            border-radius: 12px;
            overflow: hidden;
            text-align: left;
            background: white;
        }

        .card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            display: block;
            background: #dbeafe;
        }

        .card-content {
            padding: 15px;
        }

        .card h3 {
            color: #0077b6;
            margin-top: 0;
        }

        .card button {
            width: 100%;
        }

        .hidden {
            display: none !important;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #023e8a;
            color: white;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            main {
                padding: 15px;
            }

            .hero-photo {
                height: 230px;
            }

            nav button {
                padding: 10px 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Philippine Tourist Spots</h1>
    <p>Discover the beauty of the Philippines!</p>
</header>

<nav aria-label="Main navigation">
    <button class="active" data-page="home"
        onclick="showPage('home')">Home</button>

    <button data-page="boracay"
        onclick="showPage('boracay')">Boracay</button>

    <button data-page="palawan"
        onclick="showPage('palawan')">Palawan</button>

    <button data-page="baguio"
        onclick="showPage('baguio')">Baguio</button>

    <button data-page="bohol"
        onclick="showPage('bohol')">Bohol</button>
</nav>

<main id="content">
    <!-- Content is generated by JavaScript -->
</main>

<footer>
    <p>© 2026 Philippine Tourist Spots | Travel and Explore</p>
</footer>

<script>
    const pages = {
        home: {
            title: "Welcome, Travelers!",
            image: "https://images.unsplash.com/photo-1518509562904-e7ef99cdcc86?auto=format&fit=crop&w=1200&q=80",
            description:
                "Explore the amazing islands, beaches, mountains, and natural wonders of the Philippines."
        },

        boracay: {
            title: "Boracay Island",
            image: "https://images.unsplash.com/photo-1510414842594-a61c69b5ae57?auto=format&fit=crop&w=1200&q=80",
            description:
                "Boracay is famous for its white sand beaches, clear blue water, exciting water activities, and beautiful sunsets.",
            extra: "Best for swimming, beach activities, and sunsets."
        },

        palawan: {
            title: "Palawan",
            image: "https://images.unsplash.com/photo-1516690561799-46d8f74f9abf?auto=format&fit=crop&w=1200&q=80",
            description:
                "Palawan offers beautiful lagoons, limestone cliffs, turquoise waters, and unforgettable island-hopping adventures.",
            extra: "Best for nature lovers, snorkeling, and island adventures."
        },

        baguio: {
            title: "Baguio City",
            image: "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1200&q=80",
            description:
                "Baguio is known for its cool climate, pine trees, parks, gardens, and relaxing mountain atmosphere.",
            extra: "Visit Burnham Park, Mines View Park, and the city's gardens."
        },

        bohol: {
            title: "Bohol",
            image: "https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1200&q=80",
            description:
                "Bohol is known for the Chocolate Hills, beaches, the Philippine tarsier, and beautiful countryside.",
            extra: "Best for nature, wildlife, and scenic adventures."
        }
    };

    const content = document.getElementById("content");

    function showPage(page) {
        const spot = pages[page];

        if (!spot) return;

        document.querySelectorAll("nav button").forEach(button => {
            button.classList.toggle(
                "active",
                button.dataset.page === page
            );
        });

        if (page === "home") {
            content.innerHTML = `
                <img class="hero-photo"
                    src="${spot.image}"
                    alt="Philippine scenery"
                    onerror="this.alt='Photo unavailable'">

                <h2>${spot.title}</h2>
                <p>${spot.description}</p>

                <input
                    id="search"
                    class="search-box"
                    type="search"
                    placeholder="Search a destination..."
                    aria-label="Search destinations"
                    oninput="filterDestinations()">

                <div id="destination-list" class="cards"></div>
            `;

            renderCards();
        } else {
            content.innerHTML = `
                <img class="hero-photo"
                    src="${spot.image}"
                    alt="${spot.title}"
                    onerror="this.alt='Photo unavailable'">

                <h2>${spot.title}</h2>
                <p>${spot.description}</p>
                <p><strong>${spot.extra}</strong></p>

                <button class="explore"
                    onclick="showPage('home')">
                    ← Back to Home
                </button>
            `;
        }

        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderCards(searchText = "") {
        const list = document.getElementById("destination-list");
        if (!list) return;

        const destinations = Object.entries(pages)
            .filter(([key]) => key !== "home")
            .filter(([key, spot]) =>
                (key + " " + spot.title + " " + spot.description)
                .toLowerCase()
                .includes(searchText.toLowerCase())
            );

        if (destinations.length === 0) {
            list.innerHTML = "<p>No destinations found. Try another search.</p>";
            return;
        }

        list.innerHTML = destinations.map(([key, spot]) => `
            <article class="card">
                <img
                    src="${spot.image}"
                    alt="${spot.title}"
                    loading="lazy"
                    onerror="this.alt='Photo unavailable'">

                <div class="card-content">
                    <h3>${spot.title}</h3>
                    <p>${spot.description}</p>
                    <button class="explore"
                        onclick="showPage('${key}')">
                        Explore ${spot.title} →
                    </button>
                </div>
            </article>
        `).join("");
    }

    function filterDestinations() {
        const search = document.getElementById("search");
        renderCards(search.value.trim());
    }

    // Show the home page when the website first opens.
    showPage("home");
</script>

</body>
